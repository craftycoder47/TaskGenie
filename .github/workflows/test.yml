name: TaskGenie tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest
      - name: Compile Python files
        run: python -m py_compile orchestrator_bot.py web_app.py tests/test_web_app.py
      - name: Run tests
        run: pytest -q
